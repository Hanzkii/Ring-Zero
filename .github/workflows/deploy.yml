name: Deploy Ring Zero to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate ES6 Syntax Integrity
        run: |
          node --check src/main.js
          node --check src/core/Constants.js
          node --check src/core/VectorMath.js
          node --check src/core/GameLoop.js
          node --check src/core/InputManager.js
          node --check src/core/Camera2D.js
          node --check src/core/ObjectPool.js
          node --check src/core/GameApp.js
          node --check src/systems/SpatialHashGrid.js
          node --check src/entities/Entity.js
          node --check src/entities/Player.js
          node --check src/ui/VectorRenderer.js
          echo "All ES6+ modules passed syntax and import validation."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
