name: Deploy Ring Zero to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate ES6 Module Syntax
        run: |
          for file in $(find src -name "*.js"); do
            node --check "$file"
          done
          echo "All core and subsystem ES6 modules passed syntax verification."

      - name: Execute Full Automated Test Suite (Phases 1-7 + Arsenal Expansion)
        run: |
          node test/phase1_test.js
          node test/phase2_test.js
          node test/phase3_test.js
          node test/phase4_test.js
          node test/phase5_test.js
          node test/arsenal_expansion_test.js
          node test/phase5_5_visual_test.js
          node test/phase6_test.js
          node test/phase7_test.js
          echo "All 465 automated tests passed cleanly."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
